name: radar

# EXTERNALLY TRIGGERED ONLY. cron-job.org calls this workflow's dispatch API;
# GitHub's own `schedule:` was removed on 2026-08-21 (user request) because it
# fired ~8 extra runs a day on top of the external hourly trigger, and each
# extra run costs API spend.
#
# There is deliberately NO backup schedule: if the external cron stops, this
# workflow stops. Check cron-job.org first if runs go quiet.
#
# `--mode auto` decides what to fetch based on the current IST time, so the
# external scheduler only has to poke this one endpoint.
on:
  workflow_dispatch:

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # ref: main (not the default dispatch-time SHA) matters because this
      # workflow shares a concurrency group with blockdeals.yml, which also
      # commits radar.db — a queued run must check out the *latest* main once
      # it actually starts, or its "Commit state" step's binary-file rebase
      # can conflict and silently lose this run's DB writes (`|| true`).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run radar (auto)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # v4 Change 9: "shadow" (default, safe) or "enforce". Repo Settings
          # -> Secrets and variables -> Actions -> Variables -> New repository
          # variable. Unset/empty also means shadow (config.py's fallback).
          PREFILTER_MODE: ${{ vars.PREFILTER_MODE }}
        run: python main.py --mode auto
      - name: Commit state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db
          git diff --quiet --cached || git commit -m "state: radar run $(date -u +%FT%TZ)"
          # A failed push here (e.g. radar.db too large, or a real conflict)
          # must NOT be swallowed: it means this run's dedup memory never
          # lands, so the next run sees the same items as "new" again and
          # re-alerts on them every cycle. (2026-08-16: exactly this, from
          # radar.db crossing GitHub's 100MB push limit, silently produced
          # 6+ hours of duplicate Telegram alerts before anyone noticed.)
          if ! git pull --rebase --autostash || ! git push; then
            git rebase --abort 2>/dev/null || true
            echo "::error::state commit failed to sync — dedup memory NOT persisted this run"
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="⚠️ Liquidity Radar: state save failed this run (git push rejected). Dedup memory is stale until this is fixed — items may re-alert. Check the Actions log." \
                > /dev/null || true
            fi
            exit 1
          fi
