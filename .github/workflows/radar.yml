name: radar

# EXTERNALLY TRIGGERED ONLY. cron-job.org calls this workflow's dispatch API;
# GitHub's own `schedule:` was removed on 2026-08-21 (user request) because it
# fired ~8 extra runs a day on top of the external hourly trigger, and each
# extra run costs API spend.
#
# There is deliberately NO backup schedule: if the external cron stops, this
# workflow stops. Check cron-job.org first if runs go quiet.
#
# `--mode auto` decides what to fetch based on the current IST time, so the
# external scheduler only has to poke this one endpoint.
on:
  workflow_dispatch:

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      # Whether this run changed anything the website ships, so the deploy
      # below can be skipped when it did not.
      site_changed: ${{ steps.state.outputs.site_changed }}
    steps:
      # ref: main (not the default dispatch-time SHA) matters because this
      # workflow shares a concurrency group with blockdeals.yml, which also
      # commits radar.db — a queued run must check out the *latest* main once
      # it actually starts, or its "Commit state" step's binary-file rebase
      # can conflict and silently lose this run's DB writes (`|| true`).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run radar (auto)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # v4 Change 9: "shadow" (default, safe) or "enforce". Repo Settings
          # -> Secrets and variables -> Actions -> Variables -> New repository
          # variable. Unset/empty also means shadow (config.py's fallback).
          PREFILTER_MODE: ${{ vars.PREFILTER_MODE }}
        run: python main.py --mode auto
      # Runs BEFORE the state commit so the export lands in the SAME commit,
      # reusing the hardened push below. A second commit+push step would add
      # another conflict surface against blockdeals.yml, which shares this
      # concurrency group and also writes radar.db.
      #
      # A broken export must never block the state commit. Stale site data is
      # cosmetic; unpersisted dedup memory re-alerts every cycle until someone
      # notices (2026-08-16). So this annotates loudly and still exits 0.
      - name: Export site data
        run: |
          python export_site.py || {
            echo "::error::site export failed — site/data is stale this run"
            exit 0
          }
      - name: Commit state
        id: state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db
          # Absent on the very first run, and after an export failure above.
          if [ -d site/public/data ]; then git add site/public/data; fi
          # Record whether the site's own files moved. `grep -q` inside an if
          # is safe under `bash -e`; bare it would abort the step on no match.
          if git diff --cached --name-only | grep -q '^site/public/data'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --quiet --cached || git commit -m "state: radar run $(date -u +%FT%TZ)"
          # A failed push here (e.g. radar.db too large, or a real conflict)
          # must NOT be swallowed: it means this run's dedup memory never
          # lands, so the next run sees the same items as "new" again and
          # re-alerts on them every cycle. (2026-08-16: exactly this, from
          # radar.db crossing GitHub's 100MB push limit, silently produced
          # 6+ hours of duplicate Telegram alerts before anyone noticed.)
          if ! git pull --rebase --autostash || ! git push; then
            git rebase --abort 2>/dev/null || true
            echo "::error::state commit failed to sync — dedup memory NOT persisted this run"
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="⚠️ Liquidity Radar: state save failed this run (git push rejected). Dedup memory is stale until this is fixed — items may re-alert. Check the Actions log." \
                > /dev/null || true
            fi
            exit 1
          fi

  # Ships the data this run just produced. Separate job so a deploy failure is
  # reported without touching the alerting pipeline's own result — by the time
  # this starts, alerts are sent and dedup state is persisted.
  deploy-site:
    needs: run
    if: needs.run.outputs.site_changed == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
