name: radar

# Primary trigger is an EXTERNAL scheduler (e.g. cron-job.org) calling this
# workflow's dispatch API every ~15 min — GitHub's own cron is unreliable.
# The GitHub schedule below is only a lightweight backup.
#
# `--mode auto` decides what to fetch based on the current IST time, so the
# external scheduler only has to poke this one endpoint.
on:
  workflow_dispatch:
  schedule:
    - cron: "9,39 2-16 * * *"   # backup only: ~07:39-22:39 IST every 30 min

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # ref: main (not the default dispatch-time SHA) matters because this
      # workflow shares a concurrency group with blockdeals.yml, which also
      # commits radar.db — a queued run must check out the *latest* main once
      # it actually starts, or its "Commit state" step's binary-file rebase
      # can conflict and silently lose this run's DB writes (`|| true`).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run radar (auto)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --mode auto
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db
          git diff --quiet --cached || git commit -m "state: radar run $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push || true
