name: slow

# 08:00, 14:00, 20:00 IST daily (02:30, 08:30, 14:30 UTC).
# Sources: SEBI DRHP.
on:
  # Off-peak minute (:34) for more reliable scheduled triggering.
  schedule:
    - cron: "34 2,8,14 * * *"   # IST ~08:04, 14:04, 20:04
  workflow_dispatch:

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run radar (slow / SEBI DRHP)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --mode slow
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db
          git diff --quiet --cached || git commit -m "state: slow run $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push || true
