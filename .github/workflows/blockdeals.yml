name: blockdeals

# v3 Changes A + B: NSE bulk/block deal files + PIT feed + salami-slice
# aggregation. Once daily, weekdays, 19:30 IST (14:00 UTC) — exchange deal
# files publish after close, around 18:00-19:00 IST.
#
# Primary trigger is the external scheduler (cron-job.org, same as
# radar.yml/digest.yml/feedback-report.yml); GitHub cron below is a backup.
on:
  schedule:
    - cron: "3 14 * * 1-5"   # off-peak minute, ~19:33 IST weekdays
  workflow_dispatch:

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # ref: main (not the default dispatch-time SHA) matters because this
      # workflow shares a concurrency group with radar.yml (which runs every
      # ~15 min and also commits radar.db) — a queued run must check out the
      # *latest* main once it actually starts, or its "Commit state" step's
      # binary-file rebase can conflict and silently lose this run's DB
      # writes (`|| true`). Demonstrated live: a real CONFIRMED alert's DB
      # record and 29 individual_sales rows were lost this way before this
      # fix — the Telegram alert had already fired, only the record vanished.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run bulk/block deals + PIT feed + aggregation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python blockdeals.py
      - name: Commit state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db
          git diff --quiet --cached || git commit -m "state: blockdeals run $(date -u +%FT%TZ)"
          # See radar.yml's Commit state step for why this must not be
          # swallowed with `|| true` anymore.
          if ! git pull --rebase --autostash || ! git push; then
            git rebase --abort 2>/dev/null || true
            echo "::error::state commit failed to sync — this run's DB writes NOT persisted"
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="⚠️ Liquidity Radar: blockdeals state save failed this run (git push rejected). Check the Actions log." \
                > /dev/null || true
            fi
            exit 1
          fi
