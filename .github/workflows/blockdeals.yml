name: blockdeals

# v3 Changes A + B: NSE bulk/block deal files + PIT feed + salami-slice
# aggregation. Once daily, weekdays, 19:30 IST (14:00 UTC) — exchange deal
# files publish after close, around 18:00-19:00 IST.
#
# Primary trigger is the external scheduler (cron-job.org, same as
# radar.yml/digest.yml/feedback-report.yml); GitHub cron below is a backup.
on:
  schedule:
    - cron: "3 14 * * 1-5"   # off-peak minute, ~19:33 IST weekdays
  workflow_dispatch:

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    outputs:
      # Whether this run changed anything the website ships.
      site_changed: ${{ steps.state.outputs.site_changed }}
    runs-on: ubuntu-latest
    steps:
      # ref: main (not the default dispatch-time SHA) matters because this
      # workflow shares a concurrency group with radar.yml (which runs every
      # ~15 min and also commits radar.db) — a queued run must check out the
      # *latest* main once it actually starts, or its "Commit state" step's
      # binary-file rebase can conflict and silently lose this run's DB
      # writes (`|| true`). Demonstrated live: a real CONFIRMED alert's DB
      # record and 29 individual_sales rows were lost this way before this
      # fix — the Telegram alert had already fired, only the record vanished.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run bulk/block deals + PIT feed + aggregation
        env:
          # ANTHROPIC_API_KEY is deliberately NOT passed (2026-09-11).
          # The system must be completely free, not merely cheap, so the
          # paid provider is unreachable from here by construction rather
          # than by a config flag someone could flip by accident. Restoring
          # paid fallback means putting this line back AND setting the
          # CLASSIFIER_FALLBACK repo variable to "anthropic".
          # blockdeals -> deals_files.resolve_ambiguous_sellers is a model call
          # too, and it goes through the same seam (llm.py) as stages 1 and 2.
          # Without these it would silently keep using Anthropic while radar.yml
          # had moved on, and the two workflows would disagree about sellers.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLASSIFIER_PROVIDER: ${{ vars.CLASSIFIER_PROVIDER }}
          CLASSIFIER_FALLBACK: ${{ vars.CLASSIFIER_FALLBACK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python blockdeals.py
      # This workflow creates deals too — block/bulk deals and PIT
      # disclosures — so it has to refresh the site's data like radar.yml
      # does. Without this its deals alerted on Telegram and never appeared
      # on the website (2026-09-09: a block deal did exactly that).
      - name: Export site data
        run: |
          python export_site.py || {
            echo "::error::site export failed — site/data is stale this run"
            exit 0
          }
      - name: Commit state
        id: state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db
          if [ -d site/public/data ]; then git add site/public/data; fi
          if git diff --cached --name-only | grep -q '^site/public/data'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --quiet --cached || git commit -m "state: blockdeals run $(date -u +%FT%TZ)"
          # See radar.yml's Commit state step for why this must not be
          # swallowed with `|| true` anymore.
          if ! git pull --rebase --autostash || ! git push; then
            git rebase --abort 2>/dev/null || true
            echo "::error::state commit failed to sync — this run's DB writes NOT persisted"
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="⚠️ Liquidity Radar: blockdeals state save failed this run (git push rejected). Check the Actions log." \
                > /dev/null || true
            fi
            exit 1
          fi

  # Same chain as radar.yml: a push made with GITHUB_TOKEN cannot start
  # another workflow, so the deploy has to be called rather than triggered.
  deploy-site:
    needs: run
    if: needs.run.outputs.site_changed == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
