name: digest

# 20:30 IST daily. Suppression summary.
#
# EXTERNALLY TRIGGERED ONLY — cron-job.org calls the dispatch API. GitHub's own
# `schedule:` was removed on 2026-08-21 (user request); it fired late or was
# dropped anyway, so it produced duplicate or missing digests rather than a
# reliable backup. If the digest stops arriving, check cron-job.org first.
on:
  workflow_dispatch:

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send daily digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python digest.py
