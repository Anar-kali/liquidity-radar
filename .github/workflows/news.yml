name: news

# Every 30 minutes, all days, 07:00-23:00 IST (01:30-17:30 UTC).
# Sources: news only.
on:
  # Off-peak minutes (:09/:39) for more reliable scheduled triggering.
  schedule:
    - cron: "39 1 * * *"       # IST ~07:09
    - cron: "9,39 2-16 * * *"  # IST ~07:39 - 22:39
    - cron: "9 17 * * *"       # IST ~22:39
  workflow_dispatch:

concurrency:
  group: liquidity-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run radar (news)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --mode news
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.db
          git diff --quiet --cached || git commit -m "state: news run $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push || true
